<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>九九マスター 魔法陣</title>
<style>
  /* ===== リセット・基本 ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #FFD700;
    --gold2: #FFA500;
    --purple: #6A0DAD;
    --purple2: #9B30FF;
    --dark: #0A0A1A;
    --dark2: #12122A;
    --panel: rgba(20,10,50,0.92);
    --star-on: #FFD700;
    --star-off: #333;
    --green: #39FF14;
    --red: #FF4444;
    --cyan: #00FFFF;
    --pink: #FF69B4;
    --white: #F0F0FF;
    --radius: 18px;
    --shadow: 0 8px 32px rgba(106,13,173,0.5);
  }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== 魔法陣背景 ===== */
  #magic-canvas {
    position: fixed; top:0; left:0; width:100%; height:100%;
    pointer-events: none; z-index: 0; opacity: 0.18;
  }

  /* ===== 全画面コンテナ ===== */
  #app {
    position: relative; z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    padding: 16px 12px 80px;
    min-height: 100vh;
  }

  /* ===== ヘッダー ===== */
  #header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-radius: var(--radius);
    border: 1px solid rgba(155,48,255,0.4);
    box-shadow: var(--shadow);
  }
  #header h1 {
    font-size: 1.3rem; font-weight: 900;
    background: linear-gradient(135deg, var(--gold), var(--purple2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: none;
  }
  #rank-badge {
    text-align: right;
    font-size: 0.75rem; color: var(--gold);
  }
  #rank-badge .rank-title { font-size: 1rem; font-weight: 700; display: block; }
  #xp-bar-wrap {
    width: 90px; height: 6px;
    background: #222; border-radius: 3px; margin-top: 3px;
    overflow: hidden;
  }
  #xp-bar { height: 100%; background: linear-gradient(90deg, var(--purple2), var(--gold)); border-radius: 3px; transition: width 0.5s; }

  /* ===== ナビゲーション ===== */
  #nav {
    display: flex; gap: 6px; margin-bottom: 14px;
    background: var(--panel);
    border-radius: var(--radius); padding: 8px;
    border: 1px solid rgba(155,48,255,0.3);
  }
  .nav-btn {
    flex: 1; padding: 8px 4px; border: none; border-radius: 12px;
    background: transparent; color: #888;
    cursor: pointer; font-size: 0.78rem; font-weight: 600;
    transition: all 0.2s;
  }
  .nav-btn.active {
    background: linear-gradient(135deg, var(--purple), var(--purple2));
    color: #fff; box-shadow: 0 2px 12px rgba(155,48,255,0.5);
  }
  .nav-btn:hover:not(.active) { color: var(--white); background: rgba(155,48,255,0.15); }

  /* ===== 画面共通 ===== */
  .screen { display: none; animation: fadeIn 0.3s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  /* ===== ホーム画面 ===== */
  /* ミッションカード */
  .mission-card {
    background: var(--panel);
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .mission-card h3 { color: var(--gold); font-size: 0.9rem; margin-bottom: 8px; }
  .daily-q-display {
    font-size: 2.2rem; font-weight: 900; text-align: center;
    background: linear-gradient(135deg, var(--cyan), var(--purple2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin: 6px 0;
  }
  .streak-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.85rem; color: var(--gold);
    justify-content: center; margin-top: 4px;
  }
  .streak-count { font-size: 1.2rem; font-weight: 800; }
  .badge-row {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
  }
  .badge {
    padding: 3px 10px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 700;
    background: linear-gradient(135deg, #2A0A5A, #4A1A8A);
    border: 1px solid var(--purple2);
    color: var(--gold);
  }
  .badge.earned {
    background: linear-gradient(135deg, var(--gold2), var(--gold));
    color: #000; border-color: var(--gold);
  }

  /* 進捗マップ */
  .progress-map {
    background: var(--panel);
    border: 1px solid rgba(155,48,255,0.35);
    border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .progress-map h3 { color: var(--purple2); font-size: 0.9rem; margin-bottom: 10px; }
  .map-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .map-cell {
    background: rgba(255,255,255,0.04);
    border-radius: 12px; padding: 8px 6px;
    text-align: center; border: 1px solid rgba(155,48,255,0.2);
    cursor: pointer; transition: all 0.2s;
    position: relative;
  }
  .map-cell:hover { border-color: var(--purple2); transform: translateY(-2px); }
  .map-cell.cleared {
    border-color: var(--gold);
    background: rgba(255,215,0,0.08);
  }
  .map-cell.locked { opacity: 0.45; cursor: default; }
  .map-cell .cell-name { font-size: 0.8rem; font-weight: 700; }
  .map-cell .cell-stars { font-size: 0.9rem; margin: 2px 0; }
  .map-cell .cell-crown { position: absolute; top:-6px; right:4px; font-size:1rem; }
  .map-cell-special {
    grid-column: span 3;
    background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(155,48,255,0.1));
    border-color: var(--gold);
  }

  /* ===== 段選択画面 ===== */
  .stage-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-bottom: 14px;
  }
  .stage-card {
    background: var(--panel);
    border: 2px solid rgba(155,48,255,0.3);
    border-radius: var(--radius); padding: 14px 8px;
    text-align: center; cursor: pointer;
    transition: all 0.2s; position: relative;
  }
  .stage-card:hover:not(.locked) {
    border-color: var(--purple2);
    transform: translateY(-3px);
    box-shadow: 0 6px 24px rgba(155,48,255,0.5);
  }
  .stage-card.cleared { border-color: var(--gold); }
  .stage-card.locked { opacity: 0.4; cursor: default; }
  .stage-card .stage-num {
    font-size: 1.8rem; font-weight: 900;
    background: linear-gradient(135deg, var(--gold), var(--purple2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .stage-card .stage-label { font-size: 0.72rem; color: #aaa; }
  .stage-card .stage-stars { font-size: 1rem; margin: 4px 0; }
  .stage-card .stage-lock { font-size: 1.4rem; }
  .stage-card .stage-crown { position:absolute; top:-8px; right:6px; font-size:1.1rem; }

  .special-stages { margin-top: 6px; }
  .special-stage-card {
    background: var(--panel);
    border: 2px solid var(--gold);
    border-radius: var(--radius); padding: 14px;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px;
  }
  .special-stage-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(255,215,0,0.3); }
  .special-stage-card.locked { opacity: 0.4; cursor: default; border-color: #555; }
  .special-stage-card .ss-icon { font-size: 2rem; }
  .special-stage-card .ss-info { flex:1; }
  .special-stage-card .ss-name { font-weight: 700; color: var(--gold); }
  .special-stage-card .ss-desc { font-size: 0.75rem; color: #aaa; margin-top: 2px; }
  .special-stage-card .ss-lock { font-size:1.2rem; color:#666; }

  /* ===== 問題画面 ===== */
  #quiz-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  #quiz-stage-label {
    font-size: 0.85rem; color: var(--purple2); font-weight: 700;
  }
  #quiz-progress-text { font-size: 0.82rem; color: #aaa; }
  #progress-bar-wrap {
    height: 6px; background: #1A1A3A; border-radius: 3px;
    margin-bottom: 14px; overflow: hidden;
  }
  #progress-bar {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--purple2), var(--gold));
    transition: width 0.4s ease;
  }

  #question-card {
    background: var(--panel);
    border: 2px solid rgba(155,48,255,0.5);
    border-radius: 24px; padding: 28px 20px;
    text-align: center; margin-bottom: 16px;
    box-shadow: 0 8px 40px rgba(106,13,173,0.4);
    position: relative; overflow: hidden;
  }
  #question-card::before {
    content: ''; position:absolute; inset:-40%; border-radius:50%;
    background: radial-gradient(circle, rgba(106,13,173,0.08) 0%, transparent 70%);
    pointer-events:none;
  }
  #combo-display {
    font-size: 0.82rem; color: var(--gold2); font-weight: 700;
    min-height: 20px; margin-bottom: 6px;
  }
  #question-text {
    font-size: 3.2rem; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(135deg, #fff, var(--purple2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1.1;
  }
  #score-row {
    display: flex; justify-content: center; gap: 20px; margin-top: 10px;
  }
  .score-item { text-align: center; }
  .score-item .s-val { font-size: 1.2rem; font-weight: 800; color: var(--gold); }
  .score-item .s-lbl { font-size: 0.65rem; color: #888; }

  /* タイマー */
  #timer-wrap {
    display: flex; align-items: center; gap: 8px;
    justify-content: center; margin-bottom: 10px; display: none;
  }
  #timer-circle {
    width: 52px; height: 52px; border-radius: 50%;
    background: conic-gradient(var(--green) 0%, #1A1A3A 0%);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 800; color: var(--green);
    box-shadow: 0 0 16px rgba(57,255,20,0.3);
    transition: background 0.1s;
  }

  /* 選択肢 */
  #choices-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 16px;
  }
  .choice-btn {
    padding: 18px 10px; border: 2px solid rgba(155,48,255,0.4);
    border-radius: 16px; background: rgba(20,10,50,0.8);
    color: var(--white); font-size: 1.5rem; font-weight: 800;
    cursor: pointer; transition: all 0.15s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    position: relative; overflow: hidden;
  }
  .choice-btn:active { transform: scale(0.95); }
  .choice-btn:hover { border-color: var(--purple2); background: rgba(155,48,255,0.15); }
  .choice-btn.correct {
    background: linear-gradient(135deg, #003A00, #005A00);
    border-color: var(--green); color: var(--green);
    box-shadow: 0 0 20px rgba(57,255,20,0.4);
    animation: correctPulse 0.4s;
  }
  .choice-btn.wrong {
    background: linear-gradient(135deg, #3A0000, #5A0000);
    border-color: var(--red); color: var(--red);
  }
  @keyframes correctPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  /* フィードバック */
  #feedback-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #feedback-msg {
    font-size: 2.5rem; font-weight: 900; opacity: 0;
    text-shadow: 0 0 20px currentColor;
    transition: opacity 0.15s;
    pointer-events: none;
  }
  #feedback-msg.show { opacity: 1; animation: feedPop 0.6s forwards; }
  @keyframes feedPop {
    0%   { opacity:1; transform: scale(0.5) translateY(20px); }
    40%  { opacity:1; transform: scale(1.2) translateY(0); }
    70%  { opacity:1; transform: scale(1); }
    100% { opacity:0; transform: scale(0.9) translateY(-30px); }
  }

  /* ===== リザルト画面 ===== */
  #result-card {
    background: var(--panel);
    border: 2px solid var(--gold);
    border-radius: 24px; padding: 28px 20px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(255,215,0,0.2);
  }
  #result-title { font-size: 1.6rem; font-weight: 900; color: var(--gold); margin-bottom: 8px; }
  #result-stars { font-size: 2.2rem; margin: 10px 0; }
  #result-stats { font-size: 0.85rem; color: #ccc; margin-bottom: 16px; line-height: 1.8; }
  #result-xp { font-size: 1rem; color: var(--green); font-weight: 700; margin-bottom: 16px; }
  #result-badges { margin-bottom: 16px; }
  .result-btn {
    display: inline-block; padding: 12px 24px; border-radius: 14px;
    border: none; cursor: pointer; font-size: 0.92rem; font-weight: 700;
    margin: 4px; transition: all 0.2s;
  }
  .result-btn.primary {
    background: linear-gradient(135deg, var(--purple), var(--purple2));
    color: #fff; box-shadow: 0 4px 16px rgba(155,48,255,0.4);
  }
  .result-btn.secondary { background: rgba(255,255,255,0.08); color: #ccc; }
  .result-btn:hover { transform: translateY(-2px); opacity: 0.9; }

  /* ===== スピードチャレンジ専用 ===== */
  #speed-bar-wrap {
    height: 10px; background: #1A1A3A; border-radius: 5px;
    margin-bottom: 14px; overflow: hidden; display: none;
  }
  #speed-bar {
    height: 100%; border-radius: 5px; transition: width 0.1s linear;
    background: linear-gradient(90deg, var(--green), var(--gold));
  }

  /* ===== ランキング / 設定画面 ===== */
  .info-card {
    background: var(--panel); border: 1px solid rgba(155,48,255,0.3);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  .info-card h3 { color: var(--gold); font-size: 0.9rem; margin-bottom: 10px; }
  .rank-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.85rem;
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-row .rr-title { color: var(--gold); font-weight: 700; flex:1; }
  .rank-row .rr-req { color: #888; font-size: 0.75rem; }
  .rank-row.current { background: rgba(155,48,255,0.1); border-radius: 8px; padding: 8px; }

  /* パーティクル */
  .particle {
    position: fixed; pointer-events: none; z-index: 200;
    font-size: 1.2rem; user-select: none;
    animation: particleFly 1.2s ease-out forwards;
  }
  @keyframes particleFly {
    0%   { opacity:1; transform: translateY(0) scale(1); }
    100% { opacity:0; transform: translateY(-120px) scale(0.4); }
  }

  /* ===== 今日のチャレンジ入力 ===== */
  #daily-input-wrap {
    display: flex; gap: 8px; align-items: center; margin-top: 8px;
  }
  #daily-input {
    flex: 1; padding: 10px 14px; border-radius: 12px;
    background: rgba(255,255,255,0.07); border: 1.5px solid rgba(155,48,255,0.4);
    color: #fff; font-size: 1.3rem; text-align: center;
    outline: none; font-weight: 700;
  }
  #daily-input:focus { border-color: var(--gold); }
  #daily-submit {
    padding: 10px 18px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--purple), var(--purple2));
    color: #fff; font-weight: 700; cursor: pointer; font-size: 0.9rem;
  }

  /* スター表示 */
  .stars-3 { color: var(--gold); }

  /* スクロール */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(155,48,255,0.4); border-radius: 2px; }

  /* ロック覆い */
  .lock-overlay {
    position: absolute; inset: 0; border-radius: inherit;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; background: rgba(0,0,0,0.3);
    pointer-events: none;
  }

  @media (max-width: 420px) {
    #question-text { font-size: 2.6rem; }
    .choice-btn { font-size: 1.25rem; padding: 14px 8px; }
    .stage-grid { grid-template-columns: repeat(3,1fr); gap: 7px; }
  }
</style>
</head>
<body>

<canvas id="magic-canvas"></canvas>

<div id="app">
  <!-- ヘッダー -->
  <div id="header">
    <h1>✨ 九九マスター</h1>
    <div id="rank-badge">
      <span class="rank-title" id="rank-title-text">九九見習い</span>
      <span id="rank-xp-text">0 XP</span>
      <div id="xp-bar-wrap"><div id="xp-bar" style="width:0%"></div></div>
    </div>
  </div>

  <!-- ナビ -->
  <div id="nav">
    <button class="nav-btn active" onclick="showScreen('home')">🏠 ホーム</button>
    <button class="nav-btn" onclick="showScreen('stages')">🎯 段選択</button>
    <button class="nav-btn" onclick="showScreen('stats')">📊 記録</button>
  </div>

  <!-- ホーム画面 -->
  <div id="screen-home" class="screen active">
    <!-- 今日のチャレンジ -->
    <div class="mission-card">
      <h3>🌟 今日のチャレンジ</h3>
      <div class="daily-q-display" id="daily-question-display">？×？ = ？</div>
      <div id="daily-input-wrap">
        <input id="daily-input" type="number" min="1" max="81" placeholder="答えは？" inputmode="numeric">
        <button id="daily-submit" onclick="submitDailyChallenge()">決定</button>
      </div>
      <div id="daily-result-msg" style="text-align:center;margin-top:6px;font-size:0.85rem;min-height:20px;"></div>
      <div class="streak-row" style="margin-top:8px;">
        🔥 <span class="streak-count" id="streak-count">0</span>日連続！
      </div>
      <div class="badge-row" id="badge-row"></div>
    </div>

    <!-- 進捗マップ -->
    <div class="progress-map">
      <h3>📜 進捗マップ</h3>
      <div class="map-grid" id="progress-map-grid"></div>
    </div>
  </div>

  <!-- 段選択画面 -->
  <div id="screen-stages" class="screen">
    <div class="stage-grid" id="stage-grid"></div>
    <div class="special-stages">
      <div class="special-stage-card locked" id="ss-mix" onclick="startSpecialMode('mix')">
        <div class="ss-icon">🌀</div>
        <div class="ss-info">
          <div class="ss-name">全段ミックスモード</div>
          <div class="ss-desc">1〜9の段をランダムに出題！全段クリアで解放</div>
        </div>
        <div class="ss-lock" id="ss-mix-lock">🔒</div>
      </div>
      <div class="special-stage-card locked" id="ss-speed" onclick="startSpecialMode('speed')">
        <div class="ss-icon">⚡</div>
        <div class="ss-info">
          <div class="ss-name">スピードチャレンジ</div>
          <div class="ss-desc">制限時間5秒！全段クリアで解放</div>
        </div>
        <div class="ss-lock" id="ss-speed-lock">🔒</div>
      </div>
    </div>
  </div>

  <!-- 問題画面 -->
  <div id="screen-quiz" class="screen">
    <div id="quiz-header">
      <span id="quiz-stage-label">1の段</span>
      <span id="quiz-progress-text">1 / 9</span>
    </div>
    <div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>

    <!-- タイムバー（スピードモード用） -->
    <div id="speed-bar-wrap"><div id="speed-bar" style="width:100%"></div></div>

    <div id="question-card">
      <div id="combo-display"></div>
      <div id="question-text">3 × 4 = ?</div>
      <div id="score-row">
        <div class="score-item"><div class="s-val" id="score-val">0</div><div class="s-lbl">スコア</div></div>
        <div class="score-item"><div class="s-val" id="correct-val">0</div><div class="s-lbl">正解</div></div>
        <div class="score-item"><div class="s-val" id="combo-val">0</div><div class="s-lbl">コンボ</div></div>
      </div>
    </div>

    <div id="choices-grid"></div>

    <div style="text-align:center;">
      <button class="result-btn secondary" onclick="quitQuiz()">やめる</button>
    </div>
  </div>

  <!-- リザルト画面 -->
  <div id="screen-result" class="screen">
    <div id="result-card">
      <div id="result-title">クリア！</div>
      <div id="result-stars">⭐⭐⭐</div>
      <div id="result-stats"></div>
      <div id="result-xp"></div>
      <div id="result-badges" class="badge-row" style="justify-content:center;"></div>
      <div style="margin-top:8px;">
        <button class="result-btn primary" id="result-next-btn" onclick="goNextStage()">次の段へ ▶</button>
        <button class="result-btn secondary" onclick="showScreen('stages')">段選択へ</button>
        <button class="result-btn secondary" onclick="showScreen('home')">ホームへ</button>
      </div>
    </div>
  </div>

  <!-- 記録画面 -->
  <div id="screen-stats" class="screen">
    <div class="info-card">
      <h3>🏆 ランク称号システム</h3>
      <div id="rank-table"></div>
    </div>
    <div class="info-card">
      <h3>🎖️ 獲得バッジ一覧</h3>
      <div class="badge-row" id="all-badges-display"></div>
    </div>
    <div class="info-card">
      <h3>📈 統計</h3>
      <div id="stats-detail"></div>
    </div>
    <div style="text-align:center;margin-top:8px;">
      <button class="result-btn secondary" onclick="if(confirm('全データをリセットしますか？'))resetAll()">🗑️ データリセット</button>
    </div>
  </div>
</div>

<!-- フィードバック -->
<div id="feedback-overlay"><div id="feedback-msg"></div></div>

<script>
// ======================================================
// 定数・設定
// ======================================================
const RANKS = [
  { title:'九九見習い', minXP:0,    maxXP:100,  color:'#aaa' },
  { title:'九九使い',   minXP:100,  maxXP:300,  color:'#4af' },
  { title:'九九名人',   minXP:300,  maxXP:600,  color:'#9B30FF' },
  { title:'九九マスター',minXP:600, maxXP:1000, color:'#FFD700' },
  { title:'九九王',     minXP:1000, maxXP:9999, color:'#FF4444' },
];
const BADGES_DEF = [
  { id:'daily_first',   label:'📅 初回チャレンジ', desc:'今日の九九を初めてクリア' },
  { id:'daily_today',   label:'✅ 今日クリア',     desc:'今日の九九をクリア！' },
  { id:'streak3',       label:'🔥×3',             desc:'3日連続チャレンジ' },
  { id:'streak7',       label:'🌟 週7連続',        desc:'7日連続でクリア（スペシャル）' },
  { id:'stage1_clear',  label:'1の段 ⭐',         desc:'1の段クリア' },
  { id:'stage9_clear',  label:'9の段 ⭐',         desc:'9の段クリア' },
  { id:'all_clear',     label:'👑 全段制覇',       desc:'全ての段をクリア' },
  { id:'perfect',       label:'💯 パーフェクト',   desc:'全問正解でクリア' },
  { id:'speed_clear',   label:'⚡ スピードマスター',desc:'スピードチャレンジクリア' },
  { id:'combo10',       label:'🔗 コンボ10',       desc:'10コンボ達成' },
];

const BASE_XP_PER_CORRECT = 10;
const COMBO_BONUS_THRESHOLD = 3;

// ======================================================
// セーブデータ管理
// ======================================================
const SAVE_KEY = 'kukuMaster_v3';
let save = loadSave();

function defaultSave() {
  return {
    xp: 0,
    stages: {}, // { "1": { stars:3, bestScore:0 }, ... }
    badges: [], // earned badge ids
    streak: 0,
    lastChallengeDate: '',
    dailyChallengeCleared: false,
    totalCorrect: 0,
    totalWrong: 0,
    totalGames: 0,
    maxCombo: 0,
  };
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    return Object.assign(defaultSave(), JSON.parse(raw));
  } catch(e) { return defaultSave(); }
}

function persist() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(save));
}

// ======================================================
// ランク計算
// ======================================================
function getRank(xp) {
  let rank = RANKS[0];
  for (const r of RANKS) { if (xp >= r.minXP) rank = r; }
  return rank;
}

function updateHeader() {
  const rank = getRank(save.xp);
  document.getElementById('rank-title-text').textContent = rank.title;
  document.getElementById('rank-title-text').style.color = rank.color;
  document.getElementById('rank-xp-text').textContent = save.xp + ' XP';
  const next = RANKS.find(r => r.minXP > save.xp) || RANKS[RANKS.length-1];
  const pct = next.minXP <= save.xp ? 100 :
    Math.round((save.xp - rank.minXP) / (next.minXP - rank.minXP) * 100);
  document.getElementById('xp-bar').style.width = Math.min(pct,100) + '%';
}

// ======================================================
// 段クリア状態
// ======================================================
function isStageCleared(n) {
  return !!(save.stages[n] && save.stages[n].stars >= 1);
}
function isStageThreeStar(n) {
  return !!(save.stages[n] && save.stages[n].stars >= 3);
}
function isStageUnlocked(n) {
  if (n === 1) return true;
  return isStageCleared(n - 1);
}
function areAllStagesCleared() {
  for (let i=1;i<=9;i++) { if (!isStageCleared(i)) return false; }
  return true;
}
function getStageStars(n) {
  return save.stages[n] ? save.stages[n].stars : 0;
}
function starsHTML(n) {
  const s = getStageStars(n);
  let h = '';
  for (let i=1;i<=3;i++) h += `<span style="color:${i<=s?'#FFD700':'#333'}">★</span>`;
  return h;
}

// ======================================================
// バッジ
// ======================================================
function earnBadge(id) {
  if (!save.badges.includes(id)) {
    save.badges.push(id);
    persist();
    showFeedback('🎖️ バッジ獲得！', '#FFD700');
  }
}
function renderBadges(containerEl) {
  if (!containerEl) return;
  containerEl.innerHTML = '';
  save.badges.forEach(id => {
    const def = BADGES_DEF.find(b=>b.id===id);
    if (!def) return;
    const el = document.createElement('div');
    el.className = 'badge earned';
    el.textContent = def.label;
    el.title = def.desc;
    containerEl.appendChild(el);
  });
  if (save.badges.length === 0) {
    containerEl.innerHTML = '<span style="color:#666;font-size:0.8rem;">まだバッジなし</span>';
  }
}

// ======================================================
// 日付・連続チャレンジ
// ======================================================
function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function checkDailyReset() {
  const today = getTodayStr();
  if (save.lastChallengeDate !== today) {
    // 日付が変わった
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate()-1);
    const yStr = `${yesterday.getFullYear()}-${yesterday.getMonth()+1}-${yesterday.getDate()}`;
    if (save.lastChallengeDate === yStr && save.dailyChallengeCleared) {
      save.streak += 1;
    } else if (save.lastChallengeDate !== today) {
      // 昨日クリアしてない or 初日
      if (save.lastChallengeDate === '') save.streak = 0;
      else if (save.lastChallengeDate !== yStr) save.streak = 0;
    }
    save.dailyChallengeCleared = false;
    save.lastChallengeDate = today;
    persist();
  }
}

// 今日の問題を日付から決定的に生成
function getDailyChallenge() {
  const today = getTodayStr();
  let hash = 0;
  for (const c of today) hash = (hash * 31 + c.charCodeAt(0)) & 0xFFFFFF;
  const a = (hash % 9) + 1;
  const b = ((hash >> 4) % 9) + 1;
  return { a, b, answer: a * b };
}

// ======================================================
// ホーム画面描画
// ======================================================
function renderHome() {
  checkDailyReset();
  const dc = getDailyChallenge();

  // 今日のチャレンジ
  const cleared = save.dailyChallengeCleared;
  const dqEl = document.getElementById('daily-question-display');
  dqEl.textContent = `${dc.a} × ${dc.b} = ?`;
  const inputWrap = document.getElementById('daily-input-wrap');
  const resultMsg = document.getElementById('daily-result-msg');
  if (cleared) {
    inputWrap.style.display = 'none';
    dqEl.textContent = `${dc.a} × ${dc.b} = ${dc.answer}`;
    resultMsg.innerHTML = '<span style="color:#39FF14;font-weight:700;">✅ 今日のチャレンジクリア済み！</span>';
  } else {
    inputWrap.style.display = 'flex';
    resultMsg.textContent = '';
    document.getElementById('daily-input').value = '';
  }

  // 連続日数
  document.getElementById('streak-count').textContent = save.streak;

  // バッジ（ホーム）
  renderBadges(document.getElementById('badge-row'));

  // 進捗マップ
  renderProgressMap();
}

function renderProgressMap() {
  const grid = document.getElementById('progress-map-grid');
  grid.innerHTML = '';
  for (let i=1;i<=9;i++) {
    const cell = document.createElement('div');
    const cleared = isStageCleared(i);
    const locked = !isStageUnlocked(i);
    cell.className = 'map-cell' + (cleared?' cleared':'') + (locked?' locked':'');
    if (cleared && isStageThreeStar(i)) {
      cell.innerHTML += '<div class="cell-crown">👑</div>';
    }
    cell.innerHTML += `<div class="cell-name">${i}の段</div>`;
    cell.innerHTML += `<div class="cell-stars">${starsHTML(i)}</div>`;
    if (locked) cell.innerHTML += '<div style="font-size:1rem;">🔒</div>';
    if (!locked) cell.onclick = () => startStage(i);
    grid.appendChild(cell);
  }
  // 特殊モード
  const allCleared = areAllStagesCleared();
  const mixCell = document.createElement('div');
  mixCell.className = 'map-cell map-cell-special' + (!allCleared?' locked':'');
  mixCell.innerHTML = `<span style="font-size:1rem;">${allCleared?'🌀 ミックス':'🔒 全段ミックス（全段クリアで解放）'}</span>`;
  if (allCleared) mixCell.onclick = () => startSpecialMode('mix');
  grid.appendChild(mixCell);
}

function submitDailyChallenge() {
  const dc = getDailyChallenge();
  const val = parseInt(document.getElementById('daily-input').value);
  const resultMsg = document.getElementById('daily-result-msg');
  if (isNaN(val)) return;

  if (val === dc.answer) {
    save.dailyChallengeCleared = true;
    save.streak = Math.max(save.streak, 1);
    // バッジ
    earnBadge('daily_first');
    earnBadge('daily_today');
    if (save.streak >= 3) earnBadge('streak3');
    if (save.streak >= 7) earnBadge('streak7');
    persist();
    showFeedback('🎉 正解！', '#39FF14');
    renderHome();
  } else {
    resultMsg.innerHTML = `<span style="color:#FF4444;">✗ 不正解… 正解は <b>${dc.answer}</b></span>`;
    showFeedback('✗', '#FF4444');
  }
}

// ======================================================
// 段選択画面
// ======================================================
function renderStages() {
  const grid = document.getElementById('stage-grid');
  grid.innerHTML = '';
  for (let i=1;i<=9;i++) {
    const card = document.createElement('div');
    const cleared = isStageCleared(i);
    const locked = !isStageUnlocked(i);
    card.className = 'stage-card' + (cleared?' cleared':'') + (locked?' locked':'');

    if (cleared && isStageThreeStar(i)) {
      card.innerHTML += '<div class="stage-crown">👑</div>';
    }
    card.innerHTML += `<div class="stage-num">${i}</div>`;
    card.innerHTML += `<div class="stage-label">の段</div>`;
    card.innerHTML += `<div class="stage-stars">${starsHTML(i)}</div>`;

    if (locked) {
      card.innerHTML += '<div class="stage-lock">🔒</div>';
    } else {
      card.onclick = () => startStage(i);
    }
    grid.appendChild(card);
  }

  // 特殊モードの解放状態更新
  const allCleared = areAllStagesCleared();
  const ssCards = [document.getElementById('ss-mix'), document.getElementById('ss-speed')];
  ssCards.forEach(el => {
    if (!el) return;
    if (allCleared) {
      el.classList.remove('locked');
      el.querySelector('.ss-lock').textContent = '▶';
    } else {
      el.classList.add('locked');
      el.querySelector('.ss-lock').textContent = '🔒';
    }
  });
}

// ======================================================
// クイズ状態
// ======================================================
let quiz = null;
let speedTimer = null;

function buildQuestions(stageNum) {
  const qs = [];
  for (let b=1;b<=9;b++) qs.push({ a: stageNum, b, ans: stageNum*b });
  return shuffle(qs);
}

function buildMixQuestions() {
  const qs = [];
  for (let a=1;a<=9;a++) for (let b=1;b<=9;b++) qs.push({ a, b, ans: a*b });
  return shuffle(qs).slice(0,18); // 18問
}

function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function makeChoices(correct) {
  const choices = new Set([correct]);
  while (choices.size < 4) {
    const a = Math.floor(Math.random()*9)+1;
    const b = Math.floor(Math.random()*9)+1;
    choices.add(a*b);
  }
  return shuffle([...choices]);
}

// ======================================================
// クイズ開始
// ======================================================
function startStage(stageNum) {
  quiz = {
    mode: 'normal',
    stageNum,
    questions: buildQuestions(stageNum),
    index: 0,
    score: 0,
    correct: 0,
    wrong: 0,
    combo: 0,
    maxCombo: 0,
    xpEarned: 0,
    answered: false,
    speedMode: false,
  };
  showScreen('quiz');
  renderQuiz();
}

function startSpecialMode(mode) {
  if (!areAllStagesCleared()) return;
  if (mode === 'mix') {
    quiz = {
      mode: 'mix',
      stageNum: null,
      questions: buildMixQuestions(),
      index: 0,
      score: 0,
      correct: 0,
      wrong: 0,
      combo: 0,
      maxCombo: 0,
      xpEarned: 0,
      answered: false,
      speedMode: false,
    };
  } else if (mode === 'speed') {
    quiz = {
      mode: 'speed',
      stageNum: null,
      questions: buildMixQuestions(),
      index: 0,
      score: 0,
      correct: 0,
      wrong: 0,
      combo: 0,
      maxCombo: 0,
      xpEarned: 0,
      answered: false,
      speedMode: true,
      timePerQ: 5000, // 5秒
    };
  }
  showScreen('quiz');
  renderQuiz();
}

function renderQuiz() {
  if (!quiz) return;
  const q = quiz.questions[quiz.index];
  const total = quiz.questions.length;

  // ヘッダー
  const lbl = quiz.mode === 'normal' ? `${quiz.stageNum}の段` :
               quiz.mode === 'mix' ? '🌀 ミックス' : '⚡ スピード';
  document.getElementById('quiz-stage-label').textContent = lbl;
  document.getElementById('quiz-progress-text').textContent = `${quiz.index+1} / ${total}`;
  document.getElementById('progress-bar').style.width = `${(quiz.index/total)*100}%`;

  // スコア
  document.getElementById('score-val').textContent = quiz.score;
  document.getElementById('correct-val').textContent = quiz.correct;
  document.getElementById('combo-val').textContent = quiz.combo;

  // コンボ表示
  const comboEl = document.getElementById('combo-display');
  if (quiz.combo >= COMBO_BONUS_THRESHOLD) {
    comboEl.textContent = `🔥 ${quiz.combo}コンボ！ ボーナス+${quiz.combo*2}`;
  } else {
    comboEl.textContent = '';
  }

  // 問題
  document.getElementById('question-text').textContent = `${q.a} × ${q.b} = ?`;

  // 選択肢
  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  const choices = makeChoices(q.ans);
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = () => answerQuiz(c, btn, choices);
    grid.appendChild(btn);
  });

  // スピードモード
  const speedBarWrap = document.getElementById('speed-bar-wrap');
  if (quiz.speedMode) {
    speedBarWrap.style.display = 'block';
    startSpeedTimer();
  } else {
    speedBarWrap.style.display = 'none';
  }

  quiz.answered = false;
}

function startSpeedTimer() {
  clearTimeout(speedTimer);
  const bar = document.getElementById('speed-bar');
  const start = Date.now();
  const duration = quiz.timePerQ;

  function tick() {
    const elapsed = Date.now() - start;
    const pct = Math.max(0, 100 - (elapsed/duration)*100);
    bar.style.width = pct + '%';
    // 色変化
    if (pct > 50) bar.style.background = 'linear-gradient(90deg,#39FF14,#FFD700)';
    else if (pct > 25) bar.style.background = 'linear-gradient(90deg,#FFD700,#FFA500)';
    else bar.style.background = 'linear-gradient(90deg,#FF4444,#FF0000)';

    if (pct <= 0) {
      // 時間切れ → 不正解扱い
      timeUp();
    } else {
      speedTimer = setTimeout(tick, 50);
    }
  }
  tick();
}

function timeUp() {
  if (quiz.answered) return;
  quiz.answered = true;
  clearTimeout(speedTimer);
  quiz.wrong++;
  quiz.combo = 0;
  save.totalWrong++;
  showFeedback('⏰ 時間切れ！', '#FF4444');
  // 正解を光らせる
  const q = quiz.questions[quiz.index];
  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.disabled = true;
    if (parseInt(btn.textContent) === q.ans) btn.classList.add('correct');
    else btn.classList.add('wrong');
  });
  setTimeout(() => nextQuestion(), 1200);
}

function answerQuiz(val, btn, choices) {
  if (quiz.answered) return;
  quiz.answered = true;
  clearTimeout(speedTimer);

  const q = quiz.questions[quiz.index];
  const correct = val === q.ans;

  // ボタン無効化
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (parseInt(b.textContent) === q.ans) b.classList.add('correct');
  });

  if (correct) {
    btn.classList.add('correct');
    quiz.correct++;
    quiz.combo++;
    quiz.maxCombo = Math.max(quiz.maxCombo, quiz.combo);
    save.totalCorrect++;

    // XP計算
    let xp = BASE_XP_PER_CORRECT;
    if (quiz.combo >= COMBO_BONUS_THRESHOLD) xp += quiz.combo * 2;
    if (quiz.speedMode) xp = Math.round(xp * 1.5);
    quiz.score += xp;
    quiz.xpEarned += xp;

    // コンボバッジ
    if (quiz.combo >= 10) earnBadge('combo10');

    showFeedback('✓ 正解！', '#39FF14');
    spawnParticles(btn, '⭐');
  } else {
    btn.classList.add('wrong');
    quiz.wrong++;
    quiz.combo = 0;
    save.totalWrong++;
    showFeedback('✗ 不正解', '#FF4444');
  }

  // スコア即時更新
  document.getElementById('score-val').textContent = quiz.score;
  document.getElementById('correct-val').textContent = quiz.correct;
  document.getElementById('combo-val').textContent = quiz.combo;

  setTimeout(() => nextQuestion(), 900);
}

function nextQuestion() {
  quiz.index++;
  if (quiz.index >= quiz.questions.length) {
    finishQuiz();
  } else {
    renderQuiz();
  }
}

function quitQuiz() {
  clearTimeout(speedTimer);
  quiz = null;
  showScreen('stages');
}

// ======================================================
// クイズ終了・リザルト
// ======================================================
function finishQuiz() {
  clearTimeout(speedTimer);
  save.totalGames++;
  if (quiz.maxCombo > save.maxCombo) save.maxCombo = quiz.maxCombo;

  // 星計算
  const total = quiz.questions.length;
  const pct = quiz.correct / total;
  let stars = 1;
  if (pct >= 0.67) stars = 2;
  if (pct === 1)   stars = 3;
  if (quiz.correct === 0) stars = 0;

  // XP付与
  save.xp += quiz.xpEarned;

  // ステージ保存（通常・ミックスのみ）
  const earnedBadgesThisRound = [];
  if (quiz.mode === 'normal') {
    const sn = quiz.stageNum;
    const prev = save.stages[sn];
    const prevStars = prev ? prev.stars : 0;
    if (!prev || stars > prevStars) {
      save.stages[sn] = { stars, bestScore: quiz.score };
    }
    // バッジ
    if (stars >= 1) {
      earnBadge(`stage${sn}_clear`);
      if (sn === 9) earnBadge('stage9_clear');
    }
    if (quiz.correct === total) earnBadge('perfect');
    if (areAllStagesCleared()) earnBadge('all_clear');
  }
  if (quiz.mode === 'speed') {
    earnBadge('speed_clear');
  }

  persist();
  updateHeader();

  // リザルト描画
  const starsStr = quiz.correct === 0 ? '' : '★'.repeat(stars) + '☆'.repeat(3-stars);
  document.getElementById('result-title').textContent =
    stars >= 3 ? '🎉 パーフェクト！' : stars >= 2 ? '✨ クリア！' : stars >= 1 ? '🌟 クリア' : '😢 もう一度！';
  document.getElementById('result-stars').innerHTML =
    `<span class="stars-3">${'★'.repeat(stars)}</span><span style="color:#333;">${'★'.repeat(3-stars)}</span>`;
  document.getElementById('result-stats').innerHTML =
    `正解: ${quiz.correct} / ${total}<br>` +
    `スコア: ${quiz.score}<br>` +
    `最大コンボ: ${quiz.maxCombo}`;
  document.getElementById('result-xp').textContent = `+${quiz.xpEarned} XP 獲得！`;
  renderBadges(document.getElementById('result-badges'));

  // 次の段ボタン
  const nextBtn = document.getElementById('result-next-btn');
  if (quiz.mode === 'normal' && quiz.stageNum < 9 && isStageUnlocked(quiz.stageNum+1)) {
    nextBtn.style.display = 'inline-block';
    nextBtn.textContent = `${quiz.stageNum+1}の段へ ▶`;
  } else {
    nextBtn.style.display = 'none';
  }

  showScreen('result');
}

function goNextStage() {
  if (!quiz || quiz.mode !== 'normal') return;
  const next = quiz.stageNum + 1;
  if (next <= 9 && isStageUnlocked(next)) startStage(next);
}

// ======================================================
// 記録画面
// ======================================================
function renderStats() {
  // ランクテーブル
  const table = document.getElementById('rank-table');
  const currentRank = getRank(save.xp);
  table.innerHTML = RANKS.map(r => {
    const isCur = r.title === currentRank.title;
    return `<div class="rank-row ${isCur?'current':''}">
      <span class="rr-title" style="color:${r.color}">${r.title}</span>
      <span class="rr-req">${r.minXP}+ XP</span>
      ${isCur?'<span style="color:#39FF14;font-size:0.75rem;">← 現在</span>':''}
    </div>`;
  }).join('');

  // バッジ
  renderBadges(document.getElementById('all-badges-display'));

  // 統計
  document.getElementById('stats-detail').innerHTML =
    `<div class="rank-row"><span>総正解数</span><span style="color:#39FF14;">${save.totalCorrect}</span></div>
     <div class="rank-row"><span>総不正解数</span><span style="color:#FF4444;">${save.totalWrong}</span></div>
     <div class="rank-row"><span>総ゲーム数</span><span style="color:#FFD700;">${save.totalGames}</span></div>
     <div class="rank-row"><span>最大コンボ</span><span style="color:#9B30FF;">${save.maxCombo}</span></div>
     <div class="rank-row"><span>連続チャレンジ</span><span style="color:#FF69B4;">${save.streak}日</span></div>
     <div class="rank-row"><span>総XP</span><span style="color:#FFD700;">${save.xp} XP</span></div>`;
}

function resetAll() {
  localStorage.removeItem(SAVE_KEY);
  save = defaultSave();
  updateHeader();
  showScreen('home');
}

// ======================================================
// 画面切替
// ======================================================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach((b,i) => {
    const map = ['home','stages','stats'];
    b.classList.toggle('active', map[i] === name);
  });
  if (name === 'home') renderHome();
  if (name === 'stages') renderStages();
  if (name === 'stats') renderStats();
  if (name === 'quiz') {} // renderQuiz は startStage から呼ばれる
}

// ======================================================
// UI エフェクト
// ======================================================
function showFeedback(text, color) {
  const el = document.getElementById('feedback-msg');
  el.textContent = text;
  el.style.color = color;
  el.classList.remove('show');
  void el.offsetWidth; // reflow
  el.classList.add('show');
}

function spawnParticles(btn, emoji) {
  const rect = btn.getBoundingClientRect();
  for (let i=0;i<5;i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emoji;
    p.style.left = (rect.left + rect.width/2 + (Math.random()-0.5)*60) + 'px';
    p.style.top  = (rect.top  + rect.height/2) + 'px';
    p.style.animationDelay = (Math.random()*0.3) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }
}

// ======================================================
// 魔法陣キャンバス
// ======================================================
(function initMagicCanvas() {
  const canvas = document.getElementById('magic-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, t=0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function drawMagicCircle(cx, cy, r, rot, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 0.8;
    ctx.translate(cx, cy);
    ctx.rotate(rot);

    // 外円
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
    // 内円
    ctx.beginPath(); ctx.arc(0,0,r*0.7,0,Math.PI*2); ctx.stroke();
    // 六芒星
    for (let s=0;s<2;s++) {
      ctx.beginPath();
      for (let i=0;i<3;i++) {
        const a = (i/3)*Math.PI*2 + s*(Math.PI/3);
        const x = Math.cos(a)*r*0.9, y = Math.sin(a)*r*0.9;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath(); ctx.stroke();
    }
    // ルーン風マーク
    for (let i=0;i<8;i++) {
      const a = (i/8)*Math.PI*2;
      const x1=Math.cos(a)*r*0.7, y1=Math.sin(a)*r*0.7;
      const x2=Math.cos(a)*r*0.85, y2=Math.sin(a)*r*0.85;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0,0,W,H);
    t += 0.003;

    // 大きな魔法陣（中央）
    drawMagicCircle(W/2, H/2, Math.min(W,H)*0.42, t, '#9B30FF', 0.6);
    drawMagicCircle(W/2, H/2, Math.min(W,H)*0.28, -t*1.5, '#FFD700', 0.4);
    drawMagicCircle(W/2, H/2, Math.min(W,H)*0.14, t*2, '#00FFFF', 0.3);

    // 角の小さな魔法陣
    const small = Math.min(W,H)*0.08;
    drawMagicCircle(small, small, small*0.7, t*2, '#FF69B4', 0.5);
    drawMagicCircle(W-small, small, small*0.7, -t*2, '#39FF14', 0.5);
    drawMagicCircle(small, H-small, small*0.7, -t*1.5, '#FFD700', 0.5);
    drawMagicCircle(W-small, H-small, small*0.7, t*1.5, '#9B30FF', 0.5);

    requestAnimationFrame(animate);
  }
  animate();
})();

// ======================================================
// 初期化
// ======================================================
updateHeader();
showScreen('home');
</script>
</body>
